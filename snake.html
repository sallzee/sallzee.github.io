<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        canvas {
            border: 2px solid black;
            background-color: white;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let snake = [{ x: 10 * box, y: 10 * box }];
        let food = {
            x: Math.floor(Math.random() * 20) * box,
            y: Math.floor(Math.random() * 20) * box
        };
        let direction = "RIGHT";
        let changingDirection = false;
        document.addEventListener("keydown", changeDirection);

        function changeDirection(event) {
            if (changingDirection) return;
            changingDirection = true;
            const keyPressed = event.keyCode;
            const LEFT = 37;
            const UP = 38;
            const RIGHT = 39;
            const DOWN = 40;
            
            if (keyPressed == LEFT && direction != "RIGHT") direction = "LEFT";
            else if (keyPressed == UP && direction != "DOWN") direction = "UP";
            else if (keyPressed == RIGHT && direction != "LEFT") direction = "RIGHT";
            else if (keyPressed == DOWN && direction != "UP") direction = "DOWN";
        }

        function draw() {
            changingDirection = false;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);
            ctx.fillStyle = "green";
            snake.forEach((segment, index) => {
                ctx.fillRect(segment.x, segment.y, box, box);
            });
            
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;
            if (direction == "LEFT") snakeX -= box;
            if (direction == "UP") snakeY -= box;
            if (direction == "RIGHT") snakeX += box;
            if (direction == "DOWN") snakeY += box;
            
            if (snakeX == food.x && snakeY == food.y) {
                food = {
                    x: Math.floor(Math.random() * 20) * box,
                    y: Math.floor(Math.random() * 20) * box
                };
            } else {
                snake.pop();
            }
            
            let newHead = { x: snakeX, y: snakeY };
            
            if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y) || 
                newHead.x < 0 || newHead.x >= canvas.width || newHead.y < 0 || newHead.y >= canvas.height) {
                clearInterval(game);
                alert("Game Over");
                document.location.reload();
            }
            
            snake.unshift(newHead);
        }
        
        let game = setInterval(draw, 100);
    </script>
</body>
</html>
